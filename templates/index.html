<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis - Security Assessment Tool</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="container">
        <header>
            <h1>🛡️ Aegis v1.0</h1>
            <button class="dark-mode-toggle" onclick="toggleDarkMode()">🌙 Dark Mode</button>
        </header>

        <main>
            <div class="panel scan-panel">
                <h2>New Scan</h2>
                <form id="scanForm">
                    <div class="form-group">
                        <label for="target">Target (with port):</label>
                        <input type="text" id="target" name="target" placeholder="apple.com:443 or 1.2.3.4:161/udp"
                            required>
                        <small style="color: #666; margin-top: 5px; display: block;">Format: domain/ip:port
                            [/protocol]</small>
                    </div>

                    <div class="form-group">
                        <label for="scanner">Scanner:</label>
                        <select id="scanner" name="scanner" required>
                            <option value="">Select a scanner...</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary">Start Scan</button>
                </form>
            </div>

            <div class="panel results-panel full-width">
                <h2>Scan Results</h2>
                <div id="resultsDisplay" class="results-output">
                    <p class="loading">Run a scan to see results</p>
                </div>
            </div>

            <div class="panel history-panel">
                <h2>Recent Scans (Last 5)</h2>
                <div id="scansList">
                    <p class="loading">Loading scans...</p>
                </div>
            </div>

            <div id="resultsModal" class="modal hidden">
                <div class="modal-content">
                    <span class="close">&times;</span>
                    <div id="resultsContent"></div>
                </div>
            </div>
        </main>

        <footer>
            <p>Aegis - Security Assessment</p>
            <p class="footer-legal">
                &copy; {{ current_year }} Ruben Abreu &middot; MIT License
            </p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>

</html>
